<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #0f172a 0%, #1e3a8a 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-sub: #93c5fd;
      --text-done: #64748b;
      --accent-blue: #3b82f6;
      --accent-hover: #2563eb;
      --delete-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-main);
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-wrapper {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      padding-top: 12px;
      text-align: left;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* FORM INPUT */
    .input-form {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .input-wrapper {
      flex: 1;
    }

    .input-wrapper input {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      font-size: 1rem;
      outline: none;
      background: var(--input-bg);
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-blue);
      background: rgba(255, 255, 255, 0.2);
    }

    .add-btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 16px;
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      font-size: 1.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .add-btn:active {
      transform: scale(0.94);
      background: var(--accent-hover);
    }

    /* SEZIONI */
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      padding: 18px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
    }

    /* ELEMENTO TASK */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      gap: 12px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    /* CHECKBOX */
    .checkbox-container {
      position: relative;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .checkbox-container input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      height: 24px;
      width: 24px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .checkbox-container input:checked ~ .checkmark {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
      left: 7px;
      top: 3px;
      width: 6px;
      height: 11px;
      border: solid white;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    .checkbox-container input:checked ~ .checkmark:after {
      display: block;
    }

    .task-text {
      font-size: 1rem;
      color: var(--text-main);
      word-break: break-word;
      font-weight: 500;
    }

    /* TASK COMPLETATE */
    .completed-section .task-item {
      opacity: 0.6;
      background: rgba(0, 0, 0, 0.15);
    }

    .completed-section .task-text {
      text-decoration: line-through;
      color: var(--text-done);
    }

    /* BOTTONE ELIMINA */
    .delete-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .delete-btn:hover, .delete-btn:active {
      color: var(--delete-red);
      background: rgba(239, 68, 68, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <header>
      <h1>Le Mie Attività</h1>
      <p>Organizza la tua giornata</p>
    </header>

    <form id="todoForm" class="input-form" action="javascript:void(0);">
      <div class="input-wrapper">
        <input type="text" id="taskInput" placeholder="Aggiungi una nuova attività..." autocomplete="off" enterkeyhint="done">
      </div>
      <button type="submit" class="add-btn" id="addBtn" aria-label="Aggiungi">+</button>
    </form>

    <div class="section">
      <div class="section-title">
        <span>Da fare</span>
        <span id="pendingCount" class="badge">0</span>
      </div>
      <ul id="pendingList" class="task-list"></ul>
    </div>

    <div class="section completed-section">
      <div class="section-title" style="color: #64748b;">
        <span>Completate</span>
        <span id="completedCount" class="badge" style="background: rgba(255,255,255,0.05); color: #64748b;">0</span>
      </div>
      <ul id="completedList" class="task-list"></ul>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo_app_blue_fullscreen';

    const todoForm = document.getElementById('todoForm');
    const taskInput = document.getElementById('taskInput');
    const pendingList = document.getElementById('pendingList');
    const completedList = document.getElementById('completedList');
    const pendingCount = document.getElementById('pendingCount');
    const completedCount = document.getElementById('completedCount');

    let tasks = [];
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        tasks = JSON.parse(saved);
      } else {
        tasks = [
          { id: Date.now() - 1000, text: "Aggiungere attività con il tasto + o Invio", completed: false },
          { id: Date.now(), text: "Creare l'app in formato full-screen", completed: true }
        ];
      }
    } catch (e) {
      tasks = [];
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (e) {}
    }

    function render() {
      pendingList.innerHTML = '';
      completedList.innerHTML = '';

      const pendingTasks = tasks.filter(t => !t.completed);
      const completedTasks = tasks.filter(t => t.completed);

      pendingCount.textContent = pendingTasks.length;
      completedCount.textContent = completedTasks.length;

      if (pendingTasks.length === 0) {
        pendingList.innerHTML = '<li class="empty-state">Nessuna attività in sospeso! 🎉</li>';
      } else {
        pendingTasks.forEach(task => pendingList.appendChild(createTaskElement(task)));
      }

      if (completedTasks.length === 0) {
        completedList.innerHTML = '<li class="empty-state">Nessuna attività completata</li>';
      } else {
        completedTasks.forEach(task => completedList.appendChild(createTaskElement(task)));
      }

      saveTasks();
    }

    function createTaskElement(task) {
      const li = document.createElement('li');
      li.className = 'task-item';

      const leftDiv = document.createElement('div');
      leftDiv.className = 'task-left';

      const label = document.createElement('label');
      label.className = 'checkbox-container';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.completed;
      checkbox.addEventListener('change', () => toggleTask(task.id));

      const checkmark = document.createElement('span');
      checkmark.className = 'checkmark';

      label.appendChild(checkbox);
      label.appendChild(checkmark);

      const spanText = document.createElement('span');
      spanText.className = 'task-text';
      spanText.textContent = task.text;

      leftDiv.appendChild(label);
      leftDiv.appendChild(spanText);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.setAttribute('aria-label', 'Elimina definitivamente');
      deleteBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      `;
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task.id);
      });

      li.appendChild(leftDiv);
      li.appendChild(deleteBtn);

      return li;
    }

    function handleAddTask(e) {
      if (e) e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      const newTask = {
        id: Date.now(),
        text: text,
        completed: false
      };

      tasks.unshift(newTask);
      taskInput.value = '';
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => {
        if (t.id === id) return { ...t, completed: !t.completed };
        return t;
      });
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      render();
    }

    todoForm.addEventListener('submit', handleAddTask);
    render();
  </script>
</body>
</html>
